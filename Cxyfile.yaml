package:
  name: oauth
  version: 0.1.3
  author: Carter Mbotho<lastcarter@gmail.com>
  description: OAuth 2.0 client library for Cxy — authorization code flow, PKCE, token refresh, and built-in GitHub provider support
  license: MIT

dependencies: []

tests:
  - file: "src/**/*.cxy"


install:
  - name: disable-macos-wait-async-warning
    script: |
      if [ $(uname) = "Darwin" ]; then
        # Disable macOS wait async warning
        echo "--define=MACOS_WAIT_ASYNC_WARNING_OFF=1"
      fi

    required: true
  - name: openssl
    script: |
      # We do not libs, cxy sources usually specify the libs they need
      cxy package find-system openssl --include-dir --lib-dir

    required: true
